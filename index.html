<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Atlantic · Atlantic Coast Tours</title>
<style>
  :root {
    --ocean: #0f2a3d;
    --ocean-2: #1c4a63;
    --sea: #2f8f83;
    --sea-light: #e3f2ef;
    --sand: #f6f1e7;
    --ink: #1d2b33;
    --muted: #6b7c85;
    --error-bg: #fdecea;
    --error-ink: #9b2c22;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--sand);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, var(--ocean), var(--ocean-2));
    color: #fff;
    padding: 14px 18px calc(14px) 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
    position: relative;
    z-index: 2;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--sea);
    display: grid; place-items: center;
    font-size: 20px; flex-shrink: 0;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.2rem; font-weight: 600; letter-spacing: .3px;
  }
  header p { font-size: .78rem; opacity: .8; margin-top: 2px; }

  /* Wave divider */
  .wave { height: 10px; background:
    radial-gradient(circle at 10px -4px, var(--ocean-2) 10px, transparent 11px) repeat-x;
    background-size: 20px 10px; }

  /* Chat area */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .row { display: flex; flex-direction: column; max-width: 85%; }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.bot  { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 10px 14px;
    border-radius: var(--radius);
    line-height: 1.45;
    font-size: .95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: pop .18s ease-out;
  }
  .user .bubble {
    background: var(--sea);
    color: #fff;
    border-bottom-right-radius: 5px;
  }
  .bot .bubble {
    background: #fff;
    color: var(--ink);
    border-bottom-left-radius: 5px;
    box-shadow: 0 1px 3px rgba(15,42,61,.12);
  }
  .bot.error .bubble {
    background: var(--error-bg);
    color: var(--error-ink);
    border: 1px solid #f3c1bb;
  }
  .meta {
    font-size: .7rem;
    color: var(--muted);
    margin: 4px 6px 0;
  }

  /* Thinking dots */
  .thinking .bubble { color: var(--muted); font-style: italic; }
  .dots span {
    display: inline-block; width: 5px; height: 5px; margin-left: 3px;
    border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite both;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }

  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Input bar */
  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e6dfd1;
  }
  input[type="text"] {
    flex: 1;
    font-size: 16px; /* prevents iOS zoom */
    padding: 12px 16px;
    border: 1.5px solid #d9d2c3;
    border-radius: 999px;
    outline: none;
    background: var(--sand);
    color: var(--ink);
    min-width: 0;
  }
  input[type="text"]:focus { border-color: var(--sea); background: #fff; }
  button {
    font-size: .95rem; font-weight: 600;
    padding: 0 20px;
    border: none; border-radius: 999px;
    background: var(--ocean);
    color: #fff;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--ocean-2); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  @media (min-width: 720px) {
    body { max-width: 720px; margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,.08); }
    .row { max-width: 70%; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">🌊</div>
    <div>
      <h1>Ask Atlantic</h1>
      <p>Atlantic Coast Tours · West of Ireland</p>
    </div>
  </header>
  <div class="wave" aria-hidden="true"></div>

  <main id="chat" aria-live="polite"></main>

  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Ask about tours, prices, availability…" aria-label="Your question">
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";
  const BRAIN_URL = "https://luas-class.kluxy.app/chat";
  const SYSTEM = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

  const chat  = document.getElementById("chat");
  const form  = document.getElementById("form");
  const input = document.getElementById("input");
  const send  = document.getElementById("send");

  function addBubble(role, text, metaText, extraClass) {
    const row = document.createElement("div");
    row.className = "row " + role + (extraClass ? " " + extraClass : "");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    if (metaText) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = metaText;
      row.appendChild(meta);
    }
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function addThinking() {
    const row = document.createElement("div");
    row.className = "row bot thinking";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = 'Thinking...<span class="dots"><span></span><span></span><span></span></span>';
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function timeNow() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  async function fetchCSV() {
    let res;
    try {
      res = await fetch(CSV_URL, { cache: "no-store" });
    } catch (e) {
      throw new Error("Could not reach the tour catalogue (" + e.message + ").");
    }
    if (!res.ok) throw new Error("Tour catalogue returned HTTP " + res.status + " " + res.statusText + ".");
    const text = await res.text();
    if (!text.trim()) throw new Error("The tour catalogue came back empty.");
    return text;
  }

  async function askBrain(csv, question) {
    let res;
    try {
      res = await fetch(BRAIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM,
          messages: [{ role: "user", content: "Live data (CSV):\n" + csv + "\n\nCustomer question: " + question }]
        })
      });
    } catch (e) {
      throw new Error("Could not reach the assistant (" + e.message + ").");
    }
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); } catch { data = null; }
    if (!res.ok) {
      const detail = (data && (data.error || data.message)) || raw.slice(0, 200) || res.statusText;
      throw new Error("Assistant returned HTTP " + res.status + ": " + (typeof detail === "string" ? detail : JSON.stringify(detail)));
    }
    if (!data) throw new Error("Assistant sent a response that isn't valid JSON.");
    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("Assistant response had no \"reply\" field.");
    }
    return data.reply;
  }

  async function handleQuestion(question) {
    addBubble("user", question);
    const thinking = addThinking();
    input.disabled = true;
    send.disabled = true;
    try {
      const csv = await fetchCSV();
      const fetchedAt = timeNow();
      const reply = await askBrain(csv, question);
      thinking.remove();
      addBubble("bot", reply, "Data fetched live at " + fetchedAt);
    } catch (err) {
      thinking.remove();
      addBubble("bot", "Sorry, something went wrong: " + (err && err.message ? err.message : String(err)), null, "error");
    } finally {
      input.disabled = false;
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || send.disabled) return;
    input.value = "";
    handleQuestion(q);
  });

  addBubble("bot", "Dia dhuit! 👋 I'm Ask Atlantic. Ask me anything about our tours: prices, dates or how many places are left.");
  input.focus();
</script>
</body>
</html>
